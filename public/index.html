<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discord Vault</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="grain"></div>

  <header>
    <div class="logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">VAULT</span>
    </div>
    <nav>
      <button class="nav-btn active" data-tab="upload">Upload</button>
      <button class="nav-btn" data-tab="gallery">Gallery</button>
    </nav>
  </header>

  <!-- UPLOAD TAB -->
  <main id="tab-upload" class="tab active">
    <section class="hero">
      <h1>Your files.<br><em>Stored in Discord.</em></h1>
      <p class="sub">Drop photos & videos here. They live in your Discord server forever — retrievable anytime.</p>
    </section>

    <div class="drop-zone" id="dropZone">
      <div class="drop-inner">
        <div class="drop-icon">↑</div>
        <p class="drop-label">Drop files here</p>
        <p class="drop-sub">or <label for="fileInput" class="file-link">browse files</label></p>
        <p class="drop-sub muted">Images & videos · Up to 500MB · Large files auto-split</p>
        <input type="file" id="fileInput" multiple accept="image/*,video/*" hidden />
      </div>
    </div>

    <div class="queue" id="queue"></div>

    <button class="upload-btn" id="uploadBtn" disabled>
      <span>Upload to Vault</span>
      <span class="btn-icon">→</span>
    </button>

    <div class="toast" id="toast"></div>
  </main>

  <!-- GALLERY TAB -->
  <main id="tab-gallery" class="tab">
    <section class="gallery-header">
      <h2>Your Vault</h2>
      <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
    </section>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="image">Images</button>
      <button class="filter-btn" data-filter="video">Videos</button>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      <div class="empty-state" id="emptyState">
        <span class="empty-icon">⬡</span>
        <p>Your vault is empty.<br>Upload some files first.</p>
      </div>
    </div>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <div class="lightbox-content" id="lightboxContent"></div>
    <div class="lightbox-info" id="lightboxInfo"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
